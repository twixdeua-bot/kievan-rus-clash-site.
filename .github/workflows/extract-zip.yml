name: Extract website ZIP

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP archive
        run: |
          set -e

          ZIP_FILE="Kievan-Rus-GITHUB-READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP archive not found: $ZIP_FILE"
            echo "Upload the archive to the root of the repository."
            exit 1
          fi

          mkdir -p /tmp/website
          unzip -o "$ZIP_FILE" -d /tmp/website

          # Determine whether the archive contains a wrapper folder.
          if [ -f "/tmp/website/index.html" ]; then
            SOURCE="/tmp/website"
          else
            INDEX_FILE=$(find /tmp/website -type f -name index.html -print -quit)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html not found in the archive."
              exit 1
            fi

            SOURCE="$(dirname "$INDEX_FILE")"
          fi

          # Copy website files into the repository.
          rsync -a "$SOURCE/" ./ \
            --exclude=".git/" \
            --exclude=".github/"

          # Remove the uploaded archive after successful extraction.
          rm "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract website project from ZIP"
          git push
